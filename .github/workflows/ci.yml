name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Defense in depth: force dotenv loading off even though no .env file
      # exists in a fresh checkout (.env is git-ignored) - see
      # bot.config.Settings / tests/conftest.py for why this matters for
      # hermetic, credential-free test runs.
      BOT_ENV_FILE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (only if a linter is configured for this repo)
        shell: bash
        run: |
          if [ -f "ruff.toml" ] || [ -f ".ruff.toml" ] || grep -q '^\[tool\.ruff\]' pyproject.toml 2>/dev/null; then
            echo "ruff configuration detected - running ruff check."
            pip install ruff
            ruff check .
          elif [ -f ".flake8" ] || grep -q '^\[flake8\]' setup.cfg 2>/dev/null; then
            echo "flake8 configuration detected - running flake8."
            pip install flake8
            flake8 .
          else
            echo "No lint configuration found (ruff/flake8) - skipping lint step."
          fi

      - name: Run tests (pytest tests/, no credentials required)
        run: pytest tests/ -v
