services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: persianbookbot:latest
    container_name: persianbookbot
    ports:
      - "8000:8000"
    volumes:
      # Persistent host-mounted storage for uploaded PDFs and generated
      # EPUB/DOCX/TXT output. Matches the non-root app user's UID/GID 1000
      # baked into the image (see Dockerfile) so files written by the
      # container are owned/readable on the host without extra chown steps.
      - ./data:/app/data
    env_file:
      # Runtime-only secret/config injection (BOT_TOKEN, VISION_LLM_API_KEY,
      # etc.) - never baked into the image or this file. Copy .env.example
      # to .env and fill in values before running `docker compose up`;
      # .env itself is git-ignored and must never be committed.
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
