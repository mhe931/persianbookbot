<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>مبدل کتاب فارسی | Persian Book Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>مبدل کتاب فارسی</h1>
      <p class="subtitle">Persian Book Converter &mdash; PDF &rarr; EPUB / DOCX / TXT</p>
    </header>

    <!-- Five-step progress indicator: Uploaded, Preprocessing, OCR,
         Generating Documents, Ready. Reflects JobStatus transitions from
         src/common/models.py. Marked as a status region so screen readers
         announce step changes without needing focus. -->
    <section
      id="steps-section"
      class="steps-section"
      aria-label="مراحل تبدیل / Conversion steps"
    >
      <ol id="step-list" class="step-list" role="list">
        <li class="step" data-step="uploaded">
          <span class="step-dot" aria-hidden="true">1</span>
          <span class="step-label">آپلود شد<br /><small>Uploaded</small></span>
        </li>
        <li class="step" data-step="preprocessing">
          <span class="step-dot" aria-hidden="true">2</span>
          <span class="step-label">پیش‌پردازش<br /><small>Preprocessing</small></span>
        </li>
        <li class="step" data-step="ocr">
          <span class="step-dot" aria-hidden="true">3</span>
          <span class="step-label">تشخیص متن<br /><small>OCR</small></span>
        </li>
        <li class="step" data-step="converting">
          <span class="step-dot" aria-hidden="true">4</span>
          <span class="step-label">ساخت فایل‌ها<br /><small>Generating Documents</small></span>
        </li>
        <li class="step" data-step="done">
          <span class="step-dot" aria-hidden="true">5</span>
          <span class="step-label">آماده<br /><small>Ready</small></span>
        </li>
      </ol>
    </section>

    <section class="upload-section">
      <label for="pdf-input" class="file-label">فایل PDF را انتخاب کنید (Choose PDF)</label>
      <input type="file" id="pdf-input" accept="application/pdf,.pdf" />
      <p id="file-meta" class="file-meta" aria-live="polite"></p>

      <fieldset class="format-fieldset">
        <legend>فرمت‌های خروجی / Output formats</legend>
        <label class="format-toggle">
          <input type="checkbox" id="format-txt" value="txt" checked />
          TXT
        </label>
        <label class="format-toggle">
          <input type="checkbox" id="format-docx" value="docx" checked />
          DOCX
        </label>
        <label class="format-toggle">
          <input type="checkbox" id="format-epub" value="epub" checked />
          EPUB
        </label>
      </fieldset>

      <button id="upload-btn" type="button">آپلود / Upload</button>

      <div id="upload-progress-wrap" class="upload-progress-wrap hidden">
        <div class="progress-bar" aria-hidden="true">
          <div id="upload-progress-fill" class="progress-fill"></div>
        </div>
        <span id="upload-progress-text" class="progress-text">0%</span>
      </div>
    </section>

    <section
      id="status-section"
      class="status-section hidden"
      role="status"
      aria-live="polite"
    >
      <h2>وضعیت / Status</h2>
      <p id="status-text">-</p>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </section>

    <section id="downloads-section" class="downloads-section hidden">
      <h2>دانلود / Download</h2>
      <div id="download-cards" class="download-cards"></div>
    </section>

    <section
      id="error-section"
      class="error-section hidden"
      role="alert"
      aria-live="assertive"
    >
      <p id="error-text"></p>
      <button id="retry-btn" type="button" class="retry-btn hidden">
        تلاش مجدد / Retry
      </button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
