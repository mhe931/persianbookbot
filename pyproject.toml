[project]
name = "persianbookbot"
version = "0.1.0"
description = "Telegram bot that converts scanned Persian PDF books into EPUB, DOCX, and TXT via an async Persian OCR/RTL pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Optional production OCR backends - never required for the offline default
# (DummyOCREngine) or for `pytest tests/`, which mocks these at the module
# boundary. Install only the extra(s) you actually plan to use.
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
vision-llm = ["httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
